
# HTTP: conservar la ruta de validación de Let's Encrypt.
# Todo el resto redirige a HTTPS con www.
server {
    listen 80;
    server_name tcgcommunity.es www.tcgcommunity.es;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://www.tcgcommunity.es$request_uri;
    }
}

# HTTPS del dominio raíz: redirigir a www.
server {
    listen 443 ssl;
    server_name tcgcommunity.es;

    ssl_certificate
        /etc/letsencrypt/live/tcgcommunity.es/fullchain.pem;
    ssl_certificate_key
        /etc/letsencrypt/live/tcgcommunity.es/privkey.pem;

    return 301 https://www.tcgcommunity.es$request_uri;
}

# HTTPS del dominio principal.
server {
    listen 443 ssl;
    server_name www.tcgcommunity.es;

    ssl_certificate
        /etc/letsencrypt/live/tcgcommunity.es/fullchain.pem;
    ssl_certificate_key
        /etc/letsencrypt/live/tcgcommunity.es/privkey.pem;

    # El navegador solo usa HTTPS durante un año (el resto de cabeceras de seguridad las pone Next.js)
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Frontend Next.js. El backend NO se publica: la web le habla por la red interna de Docker (http://backend:8080).
    # Por eso no hay un «location /api/» hacia el backend: las rutas /api/... de la web (si las hubiera) llegarían a Next.js.
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# HTTPS para Dozzle en puerto 9080.
server {

    listen 9080 ssl;
    server_name www.tcgcommunity.es;

    ssl_certificate
        /etc/letsencrypt/live/tcgcommunity.es/fullchain.pem;

    ssl_certificate_key
        /etc/letsencrypt/live/tcgcommunity.es/privkey.pem;
    
    # Autenticación básica
    auth_basic "Acceso restringido - TCG Community";
    auth_basic_user_file /etc/nginx/auth/dozzle.htpasswd;

    location / {
        proxy_pass http://dozzle:8080;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
