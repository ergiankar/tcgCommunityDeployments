
# HTTP: conservar la ruta de validación de Let's Encrypt.
# Todo el resto redirige a HTTPS con www.
server {
    listen 80;
    server_name tcgcommunity.es www.tcgcommunity.es;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://www.tcgcommunity.es$request_uri;
    }
}

# HTTPS del dominio raíz: redirigir a www.
server {
    listen 443 ssl;
    server_name tcgcommunity.es;

    ssl_certificate
        /etc/letsencrypt/live/tcgcommunity.es/fullchain.pem;
    ssl_certificate_key
        /etc/letsencrypt/live/tcgcommunity.es/privkey.pem;

    return 301 https://www.tcgcommunity.es$request_uri;
}

# HTTPS del dominio principal.
server {
    listen 443 ssl;
    server_name www.tcgcommunity.es;

    ssl_certificate
        /etc/letsencrypt/live/tcgcommunity.es/fullchain.pem;
    ssl_certificate_key
        /etc/letsencrypt/live/tcgcommunity.es/privkey.pem;

    # Frontend Next.js
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Backend Spring Boot.
    # Se conserva el prefijo /api/ en la petición.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# HTTPS para Dozzle en puerto 9080.
server {

    listen 9080 ssl;
    server_name www.tcgcommunity.es;

    ssl_certificate
        /etc/letsencrypt/live/tcgcommunity.es/fullchain.pem;

    ssl_certificate_key
        /etc/letsencrypt/live/tcgcommunity.es/privkey.pem;
    
    # Autenticación básica
    auth_basic "Acceso restringido - TCG Community";
    auth_basic_user_file /etc/nginx/auth/dozzle.htpasswd;

    location / {
        proxy_pass http://dozzle:8080;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
