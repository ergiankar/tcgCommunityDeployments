
services:
  nginx:
    image: nginx:alpine
    container_name: tcg-community-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - backend
    networks:
      - tcg-network
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tcgcommunity}
      POSTGRES_USER: ${POSTGRES_USER:-tcg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Debes definir POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Un volumen nuevo fuerza la inicialización de PostgreSQL desde cero al levantar el despliegue.
      - pgdata-prd:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    networks:
      - tcg-network

  openbao:
    image: openbao/openbao:2.7.2
    container_name: tcg-community-openbao
    command: server -config=/openbao/config/openbao.hcl
    restart: unless-stopped
    cap_add:
      - IPC_LOCK
    volumes:
      - ./openbao/openbao.hcl:/openbao/config/openbao.hcl:ro
      - openbao-data:/openbao/data
    # El puerto no se publica en el host: solo el backend de esta red puede acceder a OpenBao.
    expose:
      - "8200"
    healthcheck:
      # `bao status` devuelve 0 únicamente después de inicializar y desbloquear el almacén.
      test: ["CMD-SHELL", "BAO_ADDR=http://127.0.0.1:8200 bao status >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks:
      - tcg-network

  backend:
    image: ${BACKEND_IMAGE:-tcg-community-back:1.0.0}
    container_name: tcg-community-backend
    restart: unless-stopped

    environment:
      # Spring
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:?Debes definir SPRING_PROFILES_ACTIVE}
      SERVER_PORT: 8080

      # Base de datos
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-tcgcommunity}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-tcg}
      # Los secretos del backend se leen del motor KV v2 de OpenBao.
      SPRING_CONFIG_IMPORT: vault://
      SPRING_CLOUD_VAULT_URI: http://openbao:8200
      # Se deja vacío durante el bootstrap para poder levantar solo OpenBao;
      # el backend no arrancará hasta definir este token limitado.
      SPRING_CLOUD_VAULT_TOKEN: ${OPENBAO_BACKEND_TOKEN:-}
      SPRING_CLOUD_VAULT_KV_BACKEND: tcgcommunity
      SPRING_CLOUD_VAULT_KV_APPLICATION_NAME: tcg-community-backend
      FRONTEND_URL: ${FRONTEND_URL:?Debes definir FRONTEND_URL}
      REQUIRE_VERIFIED_EMAIL: ${REQUIRE_VERIFIED_EMAIL:-true}

      # Google
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}

      # Email
      MAIL_PROVIDER: ${MAIL_PROVIDER:-log}
      MAIL_FROM: ${MAIL_FROM:-no-reply@tcgcommunity.local}

      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:-true}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:-true}

      PHOTO_VERIFICATION_TRUST_CLIENT_FLAG: ${PHOTO_VERIFICATION_TRUST_CLIENT_FLAG:-true}

      # Logging
      LOG_FILE: ${LOG_FILE:-logs/backend.log}

    ports:
      - "${BACKEND_PORT:-8080}:8080"

    depends_on:
      postgres:
        condition: service_healthy
      openbao:
        condition: service_healthy

    expose:
      - "8080"

    networks:
      - tcg-network

  frontend:
    image: ${FRONTEND_IMAGE:-tcgcommunity-front-app:1.0.0}
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      # La misma clave que el backend (PHOTO_VERIFICATION_SECRET): con ella el servidor web firma las fotos que ha
      # comprobado contra la imagen oficial. Sin ella, en producción ninguna foto queda verificada.
      PHOTO_VERIFICATION_SECRET: ${PHOTO_VERIFICATION_SECRET}
      # Sin él, la pantalla de acceso no enseña el botón de Google (el mismo identificador que el backend)
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      API_BASE_URL: ${API_BASE_URL:-http://backend:8080}
      API_DEV: ${API_DEV:-}
    # Solo las imágenes descargadas se conservan entre despliegues. El catálogo y
    # las huellas ya vienen incluidos en la imagen que se está ejecutando.
    volumes:
      - tcg-data:/app/data/card-images
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend
    restart: unless-stopped
    expose:
      - "3000"
    networks:
      - tcg-network

volumes:
  pgdata-prd:
  tcg-data:
  openbao-data:

networks:
  tcg-network:
    driver: bridge
